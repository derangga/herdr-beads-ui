name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # The typecheck needs herdr's .d.ts files, which only a herdr-app install has.
      - run: npm run build
      - name: herdr-app/mods/beads is current
        run: git diff --exit-code -- herdr-app
