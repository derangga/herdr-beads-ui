name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # The typecheck needs herdr's .d.ts files, which only a herdr-app install has.
      - run: npm run build
      # Untracked output counts too: a new mod's folder must be committed.
      - name: herdr-app is current
        run: test -z "$(git status --porcelain -- herdr-app)" || { git status --short -- herdr-app; git diff -- herdr-app; exit 1; }
